name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish from any branch without merging first — useful for
  # previewing on a phone.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No NEXT_PUBLIC_SUPABASE_* here, on purpose: the public demo stays on
      # placeholder data. Adding them would let any visitor write rows to the
      # real project, since the anon key ships to the browser and anonymous
      # sign-in is open. Real data is a local-development-only thing for now.
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # `enablement` turns Pages on for the repo if it isn't already, so the
      # first run doesn't need a manual visit to Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
